[package]
name = "jose-jwk"
authors = ["RustCrypto Developers"]
license = "Apache-2.0 OR MIT"
description = """
Pure Rust implementation of the JSON Web Key (JWK) component of the
Javascript Object Signing and Encryption (JOSE) specification as described in
RFC7517
"""
documentation = "https://docs.rs/jose-jwk"
homepage = "https://github.com/RustCrypto/JOSE/tree/master/jose-jwk"
repository.workspace = true
categories = ["cryptography", "data-structures", "encoding", "parser-implementations"]
keywords = ["json", "jose", "jwk"]
readme = "README.md"

version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["crypto"]
crypto = ["p256", "p384", "p521", "k256", "rsa", "hmac", "aes-gcm", "aes-kw", "ecdh"]

# Curve features - only enable features in jose-jwa, no direct dependencies
k256 = ["jose-jwa/k256"]
p256 = ["jose-jwa/p256"]
p384 = ["jose-jwa/p384"]
p521 = ["jose-jwa/p521"]

# RSA - only enable features in jose-jwa, no direct dependencies
rsa = ["jose-jwa/rsa"]

# Symmetric key algorithms
hmac = ["jose-jwa/hmac"]
aes-gcm = ["jose-jwa/aes-gcm"]
aes-kw = ["jose-jwa/aes-kw"]
aes-cbc-hmac = ["jose-jwa/aes-cbc-hmac"]

# Key agreement
ecdh = ["jose-jwa/ecdh", "p256", "p384", "p521"]

# Password-based encryption
pbes2 = ["jose-jwa/pbes2"]

# Legacy/vulnerable algorithms
legacy = ["dep:base64ct", "dep:elliptic-curve", "dep:serde_json", "dep:serdect", "dep:subtle"]

# Thumbprint support
thumbprint = ["dep:sha2"]

[dependencies]
jose-b64 = { workspace = true }
jose-jwa = { workspace = true }
serde = { workspace = true }
zeroize = { workspace = true }

# optional dependencies
sha2 = { version = "0.11.0-rc.2", default-features = false, optional = true }
url = { version = "2.4.1", default-features = false, optional = true, features = ["serde"] }

# legacy dependencies
base64ct = { workspace = true, optional = true }
elliptic-curve = { workspace = true, optional = true }
serdect = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }

[dev-dependencies]
elliptic-curve = { workspace = true, features = ["dev"] }
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
